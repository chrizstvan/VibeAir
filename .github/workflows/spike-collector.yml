name: spike-collector
on:
  workflow_dispatch:

concurrency:
  group: spike-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: spike-data
          path: data-branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spike/requirements.txt
      - run: pip install -r spike/requirements.txt
      - name: Run collector
        working-directory: spike
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: |
          mkdir -p raw/collector
          python collector.py
      - name: Commit to branch spike-data
        working-directory: data-branch
        run: |
          mkdir -p spike/raw/collector
          cp ../spike/raw/collector/*.json spike/raw/collector/
          git config user.name "spike-bot"
          git config user.email "spike-bot@users.noreply.github.com"
          git add spike/raw/collector
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase origin spike-data
          git push origin spike-data