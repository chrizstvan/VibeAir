name: spike-collector
on:
  workflow_dispatch:

concurrency:
  group: spike-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chrizstvan/spike-data-waqi
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spike/requirements.txt
      - run: pip install -r spike/requirements.txt
      - name: Run collector
        working-directory: spike
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: python collector.py
      - name: Push ke repo data privat
        working-directory: data-repo
        run: |
          mkdir -p collector
          cp ../spike/raw/collector/*.json collector/
          git config user.name "spike-bot"
          git config user.email "spike-bot@users.noreply.github.com"
          git add collector
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase
          git push